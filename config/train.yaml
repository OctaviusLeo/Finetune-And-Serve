# Fixed settings for every LoRA Run (design.md "Fine-tuning library and PEFT method").
# The sweep varies only lora_r, lora_alpha and learning_rate (config/sweep.yaml).
peft_method: LoRA on bf16 base weights (no quantization)
max_seq_len: 256
# VRAM fallback (design.md), applied 2026-10-18: at per-device batch 8 x accumulation 2 the sweep's first Run
# (A-seed1) failed with "CUDA error: out of memory" between optimizer steps 20 and 30 on 2026-10-17 23:24 and
# 2026-10-18 01:28, both times starting from a free GPU. The batch-8 Dry_Run peak (9326 MiB reserved) plus the
# 1.2-2.4 GB the desktop holds leaves no headroom. Halved batch, doubled accumulation: effective batch stays 16.
per_device_batch_size: 4
grad_accum: 4
# Cap on this process's CUDA caching allocator (fraction of device memory), set 2026-10-18. Under WSL2 an allocation
# beyond dedicated VRAM silently spills into shared system memory instead of failing: with variable-length batches the
# allocator's cache grew past the card and the first Run slowed from about 1.5 to 7.6 s per optimizer step after step
# 200. With the cap the allocator frees cached blocks instead of growing. It changes memory use, not the computation.
cuda_memory_fraction: 0.75
epochs: 2
warmup_ratio: 0.03
lr_scheduler: linear
lora_dropout: 0.05
max_grad_norm: 1.0
weight_decay: 0.0
target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
gradient_checkpointing: true
logging_steps: 10
# VRAM Dry_Run (task 1.1): the worst case among the sweep configs, every sequence padded to max_seq_len.
dry_run:
  steps: 20
  lora_r: 16
  lora_alpha: 32
  learning_rate: 2.0e-4
  seed: 0
