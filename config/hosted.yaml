# Hosted baseline (design.md "Hosted model and Spend_Cap"): TypeSafe's Jev decision model.
provider: typesafe
url: https://api.typesafe.ai/v1/systemone
# Pinned versioned ID (jev-latest pointed here on 2026-10-18), so alias moves cannot change results.
model: jev-1.13.0
api_key_env: TYPESAFE_API_KEY
timeout_s: 120
# Slot candidates: every contiguous span of up to this many whitespace tokens of the request.
max_span_tokens: 6
# Requests with more span questions than this are split into several requests over the same state.
max_span_questions_per_request: 100
# USD per 1M tokens (TypeSafe Models page): input tokens are billed, output tokens are free.
prices_usd_per_1m_tokens:
  input: 0.042
  output: 0.0
prices_source: https://docs.typesafe.ai/models
prices_accessed: "2026-10-18"
# Owner-set Spend_Cap (design.md). No task raises it.
spend_cap_usd: 2.00
ledger_path: results/hosted_ledger.jsonl
